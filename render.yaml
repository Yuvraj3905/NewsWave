services:
  - type: web
    name: newswave-api
    env: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pnpm install --no-frozen-lockfile && pnpm build
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SYNCHRONIZE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: SEED_MANAGER_USERNAME
        sync: false
      - key: SEED_MANAGER_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Watermark: set WATERMARK_LOGO to the Cloudinary public_id of the logo
      # (e.g. newswave/logo). Leave unset to disable watermarking.
      - key: WATERMARK_LOGO
        sync: false
      - key: WATERMARK_GRAVITY
        value: north_east
      - key: WATERMARK_WIDTH
        value: "0.15"
      - key: WATERMARK_OPACITY
        value: "70"
      - key: WATERMARK_MARGIN
        value: "10"
      - key: SOCIAL_WEBHOOK_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
